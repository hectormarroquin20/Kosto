<mat-card>
    <mat-card-header>
        <h2>Nueva Transacción</h2>
    </mat-card-header>

    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="save()" class="form-container">
            <mat-form-field appearance="outline">
                <mat-label>Tipo</mat-label>
                <mat-select formControlName="type">
                    <mat-option value="SALE">Venta</mat-option>
                    <mat-option value="PURCHASE">Compra</mat-option>
                    <mat-option value="ADJUSTMENT">Ajuste</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Producto</mat-label>
                <input type="text" matInput formControlName="product" [matAutocomplete]="auto">
                <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
                    (optionSelected)="onProductSelected($event)">
                    @for (prod of filteredProducts$ | async; track prod.id) {
                    <mat-option [value]="prod">{{ prod.name }} - ${{ prod.sale_price }}</mat-option>
                    }
                </mat-autocomplete>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Cantidad</mat-label>
                <input matInput type="number" formControlName="quantity">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Monto Total</mat-label>
                <input matInput type="number" formControlName="total_amount">
                <span matTextPrefix>$&nbsp;</span>
                <mat-hint>Calculado automáticamente</mat-hint>
            </mat-form-field>

            <div class="actions">
                <button mat-button type="button" (click)="router.navigate(['/inventory/sales'])">Cancelar</button>
                <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Guardar</button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
