<main style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ 'TENANT.CONFIG.TITLE' | translate }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="tenantForm" (ngSubmit)="onSubmit()"
                style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'TENANT.CONFIG.COMPANY_NAME' | translate }}</mat-label>
                    <input matInput formControlName="company_name">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'TENANT.CONFIG.TIER' | translate }}</mat-label>
                    <input matInput formControlName="tier">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'TENANT.CONFIG.CREATED_AT' | translate }}</mat-label>
                    <input matInput formControlName="created_at">
                </mat-form-field>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button mat-button type="button" (click)="toggleEdit()">
                        {{ isFieldsEnabled ? ('TENANT.CONFIG.LOCK' | translate) : ('TENANT.CONFIG.UNLOCK' | translate)
                        }}
                    </button>
                    <button mat-flat-button color="primary" type="submit" [disabled]="!isFieldsEnabled">
                        {{ 'TENANT.CONFIG.SAVE' | translate }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</main>
