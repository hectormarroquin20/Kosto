<main style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ isEditMode ? 'Editar' : 'Nueva' }} Receta</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()"
                style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">

                <mat-form-field appearance="outline">
                    <mat-label>Seleccionar Producto</mat-label>
                    <mat-select formControlName="product_id">
                        @for (prod of products(); track prod.id) {
                        <mat-option [value]="prod.id">{{ prod.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Seleccionar Insumo</mat-label>
                    <mat-select formControlName="resource_id">
                        @for (res of resources(); track res.id) {
                        <mat-option [value]="res.id">{{ res.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Cantidad Requerida</mat-label>
                    <input matInput type="number" formControlName="required_quantity">
                </mat-form-field>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button mat-button type="button" routerLink="/recipes">Cancelar</button>
                    <button mat-flat-button color="primary" type="submit"
                        [disabled]="recipeForm.invalid">Guardar</button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</main>
