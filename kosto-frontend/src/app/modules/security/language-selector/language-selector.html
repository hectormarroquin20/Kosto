<button mat-button [matMenuTriggerFor]="menu" class="flex items-center gap-2">
    <mat-icon>language</mat-icon>
    <span class="text-gray-500 font-medium text-sm uppercase">{{ currentLanguage |
        uppercase }}</span>
</button>

<mat-menu #menu="matMenu">
    <button mat-menu-item (click)="changeLanguage('es')">Español</button>
    <button mat-menu-item (click)="changeLanguage('en')">English</button>
</mat-menu>
