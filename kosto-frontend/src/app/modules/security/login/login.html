<main class="bg-gradient-to-br from-indigo-400 via-slate-50 to-slate-400 flex justify-center items-center h-screen">
    <!-- Center the card content to make it look like an SSO portal -->
    <mat-card class="p-8 text-center w-[400px]" style="width: 400px; padding: 2rem; text-align: center;">
        <mat-card-header class="mb-6 justify-center">
            <mat-card-title>{{ 'LOGIN.TITLE' | translate }}</mat-card-title>
            <app-language-selector></app-language-selector>
        </mat-card-header>

        <mat-card-content>
            <!-- <app-form-kosto [title]="'LOGIN.FORM.TITLE' | translate"> 
            <div class="flex justify-end mb-4">
                <app-language-selector></app-language-selector>
            </div>-->

            <!-- ============================================================== -->
            <!-- NEW GATEWAY BUTTON (SSO WITH AWS COGNITO)                   -->
            <!-- ============================================================== -->
            <div class="flex flex-col items-center gap-6 mt-4">
                <p class="m-0 text-sm text-[#666]">
                    {{ 'LOGIN.SUBTITLE' | translate }}
                </p>

                <!-- We use a large button with a cloud/security icon -->
                <button mat-flat-button color="primary" (click)="onLogin()"
                    class="w-full py-6 text-base flex items-center justify-center">
                    <mat-icon class="mr-2">cloud_done</mat-icon>
                    {{ 'LOGIN.BTNCLOUD' | translate }}
                </button>
            </div>

            <!-- ============================================================== -->
            <!-- ORIGINAL FORM COMMENTED (LEGACY / BACKUP)              -->
            <!-- ============================================================== -->
            <!--
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()"
                style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; text-align: left;">

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'LOGIN.EMAIL' | translate }}</mat-label>
                    <input matInput formControlName="email" type="email">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'LOGIN.PASSWORD' | translate }}</mat-label>
                    <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'">
                    <button mat-icon-button matSuffix (click)="togglePassword()">
                        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </mat-form-field>

                <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">
                    {{ 'LOGIN.BTN' | translate }}
                </button>
            </form>
            -->

            <div class="text-center mt-6 text-sm">
                {{ 'LOGIN.ALREADY_HAVE_ACCOUNT' | translate }} <br>
                <a routerLink="/register" class="text-indigo-700 no-underline font-medium inline-block mt-2">
                    {{ 'LOGIN.GO_TO_REGISTER' | translate }}
                </a>
            </div>

        </mat-card-content>
    </mat-card>
</main>
