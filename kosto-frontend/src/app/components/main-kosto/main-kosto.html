<main class="p-4 md:p-8 max-w-screen-2xl my-0 mx-auto flex flex-col gap-4 md:gap-8 w-full">

    <mat-card class="w-full">

        <mat-card-header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <mat-card-title class="text-lg md:text-xl font-bold">{{ title }}</mat-card-title>
                @if (subtitle) {
                <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
                }
            </div>

            <div class="w-full md:w-auto">
                <ng-content select="[kosto-actions]"></ng-content>
            </div>
        </mat-card-header>

        <mat-card-content>
            <ng-content></ng-content>
        </mat-card-content>

    </mat-card>

</main>
