name: Deploy Insummi Landing

on:
  push:
    branches:
      - main # O la rama que estés usando

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insummi-landing
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: insummi-landing/package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Compilar proyecto
        run: npm run build

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: insummi-landing/dist/