version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saas_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: saas_app
    ports:
      - "5432:5432"
    networks:
      - saas_network # <--- Añadido aquí
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  saas_network:
    external: true # Indica que la red ya fue creada en la terminal